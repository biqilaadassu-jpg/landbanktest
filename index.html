<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AACEA Land Banking System</title>
<style>
:root{--nav:#0f2d3d;--nav2:#17465c;--accent:#e6a23c;--bg:#f4f7f9;--card:#fff;--text:#1d2935;--muted:#6b7a88;--green:#16835b;--red:#c74444;--amber:#c88718;--blue:#2563eb;--border:#dfe6eb;--shadow:0 8px 24px rgba(15,45,61,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:255px;background:linear-gradient(180deg,var(--nav),#09212d);color:#fff;position:fixed;inset:0 auto 0 0;padding:18px 14px;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.13)}.brand img{width:45px;height:45px;border-radius:9px;background:#fff;object-fit:contain}.brand b{font-size:14px;line-height:1.2}.brand small{display:block;color:#b7c9d2;margin-top:3px}.nav{margin-top:18px}.nav button{width:100%;border:0;background:transparent;color:#dce8ed;text-align:left;padding:12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11);color:#fff}.nav span{display:inline-block;width:28px}.side-foot{position:absolute;bottom:15px;left:14px;right:14px;color:#a9bec8;font-size:11px}.main{margin-left:255px;flex:1;min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.crumb{font-weight:700}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--nav2);color:#fff;display:grid;place-items:center;font-weight:800}.content{padding:22px;max-width:1600px;margin:auto}.page{display:none}.page.active{display:block}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:800;margin-top:6px}.stat .hint{font-size:11px;color:var(--muted);margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}.toolbar{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfd9df;border-radius:8px;padding:9px 10px;background:#fff;outline:none}.field textarea{min-height:82px;resize:vertical}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:700}.btn.primary{background:var(--nav2);color:#fff}.btn.secondary{background:#eef3f6;color:var(--nav)}.btn.green{background:#e5f5ee;color:#0d6c4b}.btn.red{background:#fdecec;color:#a72e2e}.btn.amber{background:#fff3dc;color:#98610a}.btn.dark{background:#152a36;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h2,.section-title h3{margin:0}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{background:#f8fafb;color:#64727d;font-size:11px;text-transform:uppercase}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.badge.green{background:#e5f5ee;color:#0d6c4b}.badge.red{background:#fdecec;color:#a72e2e}.badge.amber{background:#fff3dc;color:#98610a}.badge.blue{background:#e9f0ff;color:#1d4ed8}.badge.gray{background:#edf1f4;color:#5f6c76}.map{height:520px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#e9eef1}.map iframe{width:100%;height:100%;border:0}.mapbox{position:relative}.map-note{position:absolute;left:12px;bottom:12px;background:#fff;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow);font-size:11px;z-index:2}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#09212d,#1b526a)}.login-card{width:min(440px,92vw);background:#fff;border-radius:18px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.login-brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.login-brand img{width:60px;height:60px;object-fit:contain}.login h1{font-size:21px;margin:0}.login p{color:var(--muted);font-size:12px}.login .field{margin:12px 0}.login .btn{width:100%;padding:12px}.demo{margin-top:14px;background:#f6f9fa;border-radius:9px;padding:10px;font-size:11px;color:#56646d}.alert{padding:10px 12px;border-radius:9px;font-size:12px;margin:10px 0}.alert.info{background:#eaf2ff;color:#1e4fa8}.alert.warn{background:#fff4de;color:#8a5c0a}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(3,16,23,.56);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-card{background:#fff;width:min(800px,96vw);max-height:92vh;overflow:auto;border-radius:14px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.close{border:0;background:#eef2f4;border-radius:50%;width:32px;height:32px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.approval{border-left:4px solid var(--border);padding:10px 12px;margin:8px 0;background:#fafcfd}.approval.approved{border-left-color:var(--green)}.approval.pending{border-left-color:var(--amber)}.approval .who{font-weight:800;font-size:12px}.approval small{color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{font-size:11px;color:var(--muted);line-height:1.5}.kbd{font-family:monospace;background:#edf1f4;padding:2px 5px;border-radius:4px}.toast{position:fixed;right:18px;bottom:18px;background:#132f3d;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100;box-shadow:var(--shadow);font-size:12px}.toast.show{display:block}.signature{font-family:"Brush Script MT",cursive;font-size:22px}.footer-note{font-size:10px;color:#84919a;margin-top:14px}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{width:220px}.main{margin-left:220px}}@media(max-width:760px){.sidebar{position:relative;width:100%;height:auto}.side-foot{display:none}.app{display:block}.main{margin-left:0}.topbar{position:relative}.stats,.three,.form-grid{grid-template-columns:1fr}.content{padding:13px}}
</style>

<body>
<div id="root"></div>
<div class="modal" id="landModal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">New Land Record</h3><button class="close" onclick="closeModal()">×</button></div><form id="landForm"><input type="hidden" id="recordId"><div class="form-grid"><div class="field"><label>Transaction</label><select id="type" required><option value="deposit">Deposit</option><option value="withdraw">Withdraw</option></select></div><div class="field"><label>Area (m²)</label><input id="area" type="number" min="0" step="0.01" required></div><div class="field"><label>X-coordinate / Longitude</label><input id="lng" type="number" step="any" placeholder="38.7578" required></div><div class="field"><label>Y-coordinate / Latitude</label><input id="lat" type="number" step="any" placeholder="9.0192" required></div><div class="field"><label>Address</label><input id="address" required placeholder="Kebele / street / parcel address"></div><div class="field"><label>Woreda</label><select id="woreda" required></select></div><div class="field full"><label>Statement / Information</label><textarea id="statement" required></textarea></div><div class="field full" id="reasonWrap"><label>Reason of Withdraw</label><textarea id="reason" placeholder="Required for withdrawal"></textarea></div></div><div class="actions" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save Record</button></div></form></div></div>
<div class="modal" id="approvalModal"><div class="modal-card"><div class="modal-head"><h3>Approval / Record Action</h3><button class="close" onclick="closeApproval()">×</button></div><div id="approvalBody"></div></div></div>

const SUBCITIES=['Addis Ketema','Akaki Kality','Arada','Bole','Gullele','Kirkos','Kolfe Keranio','Lideta','Nifas Silk-Lafto','Yeka','Lemi Kura'];
const WOREDA_COUNT=119;
const USERS={
 'woreda':{username:'woreda',password:'woreda123',name:'Woreda Land Officer'},
 'subcity':{username:'subcity',password:'subcity123',name:'Subcity Land Officer'},
 'city':{username:'city',password:'city123',name:'AACEA City Administrator'}
};
let state=JSON.parse(localStorage.getItem('aacea_land_state')||'null')||{records:[],settings:{googleKey:'',woredaNames:{}},session:null};
let currentPage='dashboard';
function save(){localStorage.setItem('aacea_land_state',JSON.stringify(state))}
function uid(){return 'LB-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function subcityForWoreda(n){let idx=(n-1)%SUBCITIES.length;return SUBCITIES[idx]}
function woredaLabel(n){return state.settings.woredaNames[n]||('Woreda '+String(n).padStart(2,'0'))}
function init(){if(!state.records.length){const seed=[{type:'deposit',area:1250,lat:9.0192,lng:38.7578,address:'Bole demo parcel',woreda:1,statement:'Demonstration land deposit',reason:'',createdBy:'System Demo',createdAt:new Date().toISOString(),status:'approved',subcityApproval:{name:'Subcity Demo',signature:'Subcity Demo',date:new Date().toISOString()},cityApproval:{name:'City Demo',signature:'City Demo',date:new Date().toISOString()}}];seed[0].id=uid();state.records=seed;save()} renderLogin()}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><div class="login-brand"><img src="${LOGO}"><div><h1>AACEA Land Banking System</h1><p>Land Enforcement & Inventory Portal</p></div></div><div class="field"><label>Portal level</label><select id="loginRole"><option value="woreda">Woreda</option><option value="subcity">Subcity</option><option value="city">City</option></select></div><div class="field"><label>Username</label><input id="loginUser" value="woreda"></div><div class="field"><label>Password</label><input id="loginPass" type="password" value="woreda123"></div><button class="btn primary" onclick="login()">Sign in</button><div class="demo"><b>Demo accounts</b><br>Woreda: woreda / woreda123<br>Subcity: subcity / subcity123<br>City: city / city123</div><div class="footer-note">This prototype stores data in this browser only. For production, connect it to a secure backend, database, identity provider and audit service.</div></div></div>`;document.getElementById('loginRole').onchange=e=>{let r=e.target.value;document.getElementById('loginUser').value=USERS[r].username;document.getElementById('loginPass').value=USERS[r].password}}
function login(){let r=document.getElementById('loginRole').value,u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(USERS[r].username!==u||USERS[r].password!==p){toast('Invalid demo credentials');return}state.session={role:r,name:USERS[r].name};save();renderApp()}
function logout(){state.session=null;save();renderLogin()}
function renderApp(){document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><img src="${LOGO}"><div><b>ADDIS ABABA CITY<br>ADMINISTRATION</b><small>AACEA • Land Banking</small></div></div><nav class="nav"><button class="${currentPage==='dashboard'?'active':''}" onclick="go('dashboard')"><span>▦</span>Dashboard</button><button class="${currentPage==='records'?'active':''}" onclick="go('records')"><span>▤</span>Land Records</button><button class="${currentPage==='map'?'active':''}" onclick="go('map')"><span>⌖</span>Google Map</button><button class="${currentPage==='approvals'?'active':''}" onclick="go('approvals')"><span>✓</span>Approvals</button><button class="${currentPage==='settings'?'active':''}" onclick="go('settings')"><span>⚙</span>Settings</button></nav><div class="side-foot">11 Subcities • 119 Woredas<br>Role: ${esc(state.session.role.toUpperCase())}</div></aside><main class="main"><header class="topbar"><div class="crumb">AACEA / ${currentPage[0].toUpperCase()+currentPage.slice(1)}</div><div class="userbox"><div><b>${esc(state.session.name)}</b><small style="display:block;color:#72808a">${state.session.role}</small></div><div class="avatar">${esc(state.session.name[0])}</div><button class="btn secondary" onclick="logout()">Logout</button></div></header><div class="content"><section id="dashboard" class="page"></section><section id="records" class="page"></section><section id="map" class="page"></section><section id="approvals" class="page"></section><section id="settings" class="page"></section></div></main></div>`;renderAll()}
function go(p){currentPage=p;renderApp()}
function recordsForRole(){let r=state.session.role;if(r==='city')return state.records;if(r==='subcity')return state.records.filter(x=>subcityForWoreda(x.woreda)===SUBCITIES[0]||x.subcity===state.session.subcity||true);return state.records.filter(x=>x.woreda===1||x.createdBy===state.session.name||x.woreda>=1&&x.woreda<=119)}
function stats(){let rs=state.records,dep=rs.filter(x=>x.type==='deposit'),wit=rs.filter(x=>x.type==='withdraw');return {depArea:dep.reduce((a,x)=>a+Number(x.area),0),witArea:wit.reduce((a,x)=>a+Number(x.area),0),depPlaces:dep.length,witPlaces:wit.length,pending:rs.filter(x=>x.status!=='approved').length}}
function renderAll(){['dashboard','records','map','approvals','settings'].forEach(x=>document.getElementById(x).classList.toggle('active',x===currentPage));renderDashboard();renderRecords();renderMap();renderApprovals();renderSettings()}
function renderDashboard(){let s=stats();let rows=state.records.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8);document.getElementById('dashboard').innerHTML=`<div class="section-title"><div><h2>City Land Banking Dashboard</h2><div class="notice">Central overview of deposits and withdrawals across 11 sub-cities and 119 woredas.</div></div><button class="btn primary" onclick="openLand()">+ New ${state.session.role==='city'?'Record':'Land Action'}</button></div><div class="grid stats"><div class="card stat"><div class="label">Total Deposit Area</div><div class="value green">${fmt(s.depArea)} m²</div><div class="hint">All recorded deposits</div></div><div class="card stat"><div class="label">Total Withdraw Area</div><div class="value red">${fmt(s.witArea)} m²</div><div class="hint">All recorded withdrawals</div></div><div class="card stat"><div class="label">Deposit Places</div><div class="value blue">${fmt(s.depPlaces)}</div><div class="hint">Land transaction places</div></div><div class="card stat"><div class="label">Withdraw Places</div><div class="value amber">${fmt(s.witPlaces)}</div><div class="hint">Land transaction places</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title"><h3>Recent Activities</h3><button class="btn secondary" onclick="go('records')">View all</button></div><div class="table-wrap">${table(rows,false)}</div></div><div class="card"><div class="section-title"><h3>11 Subcity Summary</h3></div>${subcitySummary()}</div></div>`}
function subcitySummary(){return SUBCITIES.map(s=>{let rs=state.records.filter(x=>subcityForWoreda(x.woreda)===s),d=rs.filter(x=>x.type==='deposit').reduce((a,x)=>a+Number(x.area),0),w=rs.filter(x=>x.type==='withdraw').reduce((a,x)=>a+Number(x.area),0);return `<div style="padding:9px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px"><b>${esc(s)}</b><span><span class="green">${fmt(d)} m²</span> / <span class="red">${fmt(w)} m²</span> • ${rs.length} places</span></div>`}).join('')}
function statusBadge(x){if(x.status==='approved')return `<span class="badge green">Approved</span>`;if(x.status==='pending_city')return `<span class="badge blue">Pending City</span>`;return `<span class="badge amber">Pending Subcity</span>`}
function table(rows,actions=true){if(!rows.length)return `<div class="empty">No records found.</div>`;return `<table class="table"><thead><tr><th>ID</th><th>Type</th><th>Area</th><th>Woreda</th><th>Subcity</th><th>Address</th><th>Status</th>${actions?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.id)}</td><td><span class="badge ${x.type==='deposit'?'green':'red'}">${x.type}</span></td><td>${fmt(x.area)} m²</td><td>${esc(woredaLabel(x.woreda))}</td><td>${esc(subcityForWoreda(x.woreda))}</td><td>${esc(x.address)}</td><td>${statusBadge(x)}</td>${actions?`<td><div class="actions">${canEdit(x)?`<button class="btn secondary" onclick="openLand('${x.id}')">Edit</button><button class="btn red" onclick="delRecord('${x.id}')">Delete</button>`:''}${canApprove(x)?`<button class="btn amber" onclick="openApproval('${x.id}')">Review</button>`:`<button class="btn secondary" onclick="openApproval('${x.id}')">View</button>`}</div></td>`:''}</tr>`).join('')}</tbody></table>`}
function canEdit(x){if(x.status==='approved')return false; if(state.session.role==='woreda')return x.status==='pending_subcity'; if(state.session.role==='subcity')return x.status==='pending_city'; return true}
function canApprove(x){return (state.session.role==='subcity'&&x.status==='pending_subcity')||(state.session.role==='city'&&x.status==='pending_city')}
function renderRecords(){document.getElementById('records').innerHTML=`<div class="section-title"><div><h2>Land Records</h2><div class="notice">Filter by city, subcity, woreda and transaction. Edit/delete is available before the applicable approval.</div></div><button class="btn primary" onclick="openLand()">+ New Record</button></div><div class="card"><div class="toolbar"><div class="field"><label>Transaction</label><select id="fType" onchange="filterRecords()"><option value="">All</option><option value="deposit">Deposit</option><option value="withdraw">Withdraw</option></select></div><div class="field"><label>Subcity</label><select id="fSub" onchange="filterRecords()"><option value="">All Subcities</option>${SUBCITIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Woreda</label><select id="fWoreda" onchange="filterRecords()"><option value="">All Woredas</option>${Array.from({length:119},(_,i)=>`<option value="${i+1}">${esc(woredaLabel(i+1))}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="fStatus" onchange="filterRecords()"><option value="">All</option><option value="pending_subcity">Pending Subcity</option><option value="pending_city">Pending City</option><option value="approved">Approved</option></select></div><div class="field" style="min-width:220px"><label>Search</label><input id="fSearch" oninput="filterRecords()" placeholder="address, ID, statement..."></div></div><div id="recordTable" style="margin-top:14px"></div></div>`;filterRecords()}
function filterRecords(){let rs=state.records.slice();let t=document.getElementById('fType')?.value,s=document.getElementById('fSub')?.value,w=document.getElementById('fWoreda')?.value,st=document.getElementById('fStatus')?.value,q=(document.getElementById('fSearch')?.value||'').toLowerCase();if(t)rs=rs.filter(x=>x.type===t);if(s)rs=rs.filter(x=>subcityForWoreda(x.woreda)===s);if(w)rs=rs.filter(x=>String(x.woreda)===w);if(st)rs=rs.filter(x=>x.status===st);if(q)rs=rs.filter(x=>[x.id,x.address,x.statement,x.reason].join(' ').toLowerCase().includes(q));document.getElementById('recordTable').innerHTML=table(rs,true)}
function renderMap(){let rs=state.records;let center=rs[0]||{lat:9.0192,lng:38.7578};let key=state.settings.googleKey;let mapContent=key?`<div id="googleMap" class="map"></div>`:`<div class="map"><iframe src="https://www.google.com/maps?q=${center.lat},${center.lng}&z=12&output=embed" loading="lazy"></iframe></div>`;document.getElementById('map').innerHTML=`<div class="section-title"><div><h2>Google Map — Land Activities</h2><div class="notice">Deposit = green marker, Withdraw = red marker. The interactive marker map requires a Google Maps JavaScript API key.</div></div><button class="btn secondary" onclick="go('settings')">Map Settings</button></div><div class="card mapbox">${mapContent}<div class="map-note">${rs.length} activities • ${fmt(stats().depArea)} m² deposit • ${fmt(stats().witArea)} m² withdraw</div></div><div class="legend"><span><i class="dot" style="background:#16835b"></i>Deposit</span><span><i class="dot" style="background:#c74444"></i>Withdraw</span><span><i class="dot" style="background:#c88718"></i>Pending</span></div>`;if(key)setTimeout(loadGoogleMap,50)}
function loadGoogleMap(){if(!window.google){let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(state.settings.googleKey);s.onload=drawGoogleMap;s.onerror=()=>toast('Google Maps failed to load. Check the API key and enabled Maps JavaScript API.');document.head.appendChild(s)}else drawGoogleMap()}
function drawGoogleMap(){let el=document.getElementById('googleMap');if(!el)return;let map=new google.maps.Map(el,{center:{lat:9.0192,lng:38.7578},zoom:11,mapTypeControl:true,streetViewControl:false});state.records.forEach(x=>{let marker=new google.maps.Marker({position:{lat:Number(x.lat),lng:Number(x.lng)},map,title:x.type.toUpperCase()+' • '+x.id,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:x.type==='deposit'?'#16835b':'#c74444',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});let inf=new google.maps.InfoWindow({content:`<div style="min-width:190px"><b>${esc(x.type.toUpperCase())}</b><br>${esc(x.address)}<br>${fmt(x.area)} m²<br>${esc(woredaLabel(x.woreda))} • ${esc(subcityForWoreda(x.woreda))}<br>${statusBadge(x)}</div>`});marker.addListener('click',()=>inf.open(map,marker))})}
function renderApprovals(){let pending=state.records.filter(x=>x.status!=='approved');document.getElementById('approvals').innerHTML=`<div class="section-title"><div><h2>Approval Workflow</h2><div class="notice">Woreda → Subcity → City. Each approval records name, digital signature and date.</div></div></div><div class="card">${pending.length?pending.map(x=>`<div class="approval pending"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="who">${esc(x.type.toUpperCase())} • ${esc(x.id)}</div><small>${esc(woredaLabel(x.woreda))} • ${esc(subcityForWoreda(x.woreda))} • ${fmt(x.area)} m² • ${esc(x.address)}</small></div><div class="actions">${canEdit(x)?`<button class="btn secondary" onclick="openLand('${x.id}')">Edit</button><button class="btn red" onclick="delRecord('${x.id}')">Delete</button>`:''}<button class="btn amber" onclick="openApproval('${x.id}')">${canApprove(x)?'Review & Approve':'View'}</button></div></div></div>`).join(''):`<div class="empty">No pending approvals.</div>`}</div><div class="card" style="margin-top:16px"><h3>Approval chain example</h3><div class="approval approved"><div class="who">Woreda Officer</div><small>Creates deposit/withdraw record → sends to Subcity.</small></div><div class="approval pending"><div class="who">Subcity Officer</div><small>Reviews, edits/deletes before approval, then signs and forwards to City.</small></div><div class="approval pending"><div class="who">City Officer</div><small>Final review, edits/deletes before approval, then signs and closes the record.</small></div></div>`}
function openApproval(id){let x=state.records.find(r=>r.id===id);if(!x)return;let chain=`<div class="approval ${x.subcityApproval?'approved':'pending'}"><div class="who">Subcity Approval</div><small>${x.subcityApproval?`Name: ${esc(x.subcityApproval.name)}<br>Signature: <span class="signature">${esc(x.subcityApproval.signature)}</span><br>Date: ${new Date(x.subcityApproval.date).toLocaleString()}`:'Pending Subcity approval.'}</small></div><div class="approval ${x.cityApproval?'approved':'pending'}"><div class="who">City Approval</div><small>${x.cityApproval?`Name: ${esc(x.cityApproval.name)}<br>Signature: <span class="signature">${esc(x.cityApproval.signature)}</span><br>Date: ${new Date(x.cityApproval.date).toLocaleString()}`:'Pending City approval.'}</small></div>`;document.getElementById('approvalBody').innerHTML=`<div class="card" style="box-shadow:none;border:0;padding:0"><h3>${esc(x.type.toUpperCase())} — ${esc(x.id)}</h3><p class="notice">${esc(x.statement)}</p><div class="grid three"><div><b>Area</b><br>${fmt(x.area)} m²</div><div><b>Woreda</b><br>${esc(woredaLabel(x.woreda))}</div><div><b>Subcity</b><br>${esc(subcityForWoreda(x.woreda))}</div><div><b>Latitude (Y)</b><br>${esc(x.lat)}</div><div><b>Longitude (X)</b><br>${esc(x.lng)}</div><div><b>Address</b><br>${esc(x.address)}</div></div>${x.reason?`<p><b>Withdraw reason:</b> ${esc(x.reason)}</p>`:''}${chain}<div class="actions" style="justify-content:flex-end;margin-top:15px">${canApprove(x)?`<button class="btn green" onclick="approve('${x.id}')">Approve & Sign</button>`:''}<button class="btn secondary" onclick="closeApproval()">Close</button></div></div>`;document.getElementById('approvalModal').classList.add('open')}
function closeApproval(){document.getElementById('approvalModal').classList.remove('open')}
function approve(id){let x=state.records.find(r=>r.id===id);if(!x)return;let name=prompt('Enter approving officer name:',state.session.name);if(!name)return;let sig=prompt('Enter digital signature (type your name):',name);if(!sig)return;let now=new Date().toISOString();if(state.session.role==='subcity'&&x.status==='pending_subcity'){x.subcityApproval={name,signature:sig,date:now};x.status='pending_city';}else if(state.session.role==='city'&&x.status==='pending_city'){x.cityApproval={name,signature:sig,date:now};x.status='approved';}else{return}save();closeApproval();renderAll();toast('Approval recorded successfully')}
function openLand(id){document.getElementById('landModal').classList.add('open');document.getElementById('modalTitle').textContent=id?'Edit Land Record':'New Land Record';document.getElementById('woreda').innerHTML=Array.from({length:119},(_,i)=>`<option value="${i+1}">${esc(woredaLabel(i+1))}</option>`).join('');let x=id&&state.records.find(r=>r.id===id);document.getElementById('recordId').value=x?.id||'';document.getElementById('type').value=x?.type||'deposit';document.getElementById('area').value=x?.area||'';document.getElementById('lng').value=x?.lng||'';document.getElementById('lat').value=x?.lat||'';document.getElementById('address').value=x?.address||'';document.getElementById('woreda').value=x?.woreda||1;document.getElementById('statement').value=x?.statement||'';document.getElementById('reason').value=x?.reason||'';toggleReason()}
function closeModal(){document.getElementById('landModal').classList.remove('open')}
document.getElementById('type').onchange=toggleReason;function toggleReason(){document.getElementById('reasonWrap').style.display=document.getElementById('type').value==='withdraw'?'flex':'none'}
document.getElementById('landForm').onsubmit=e=>{e.preventDefault();let id=document.getElementById('recordId').value,x=id?state.records.find(r=>r.id===id):null;if(x&&!canEdit(x)){toast('This record is locked after approval');return}let type=document.getElementById('type').value,reason=document.getElementById('reason').value.trim();if(type==='withdraw'&&!reason){toast('Withdraw reason is required');return}let data={type,area:Number(document.getElementById('area').value),lng:Number(document.getElementById('lng').value),lat:Number(document.getElementById('lat').value),address:document.getElementById('address').value.trim(),woreda:Number(document.getElementById('woreda').value),statement:document.getElementById('statement').value.trim(),reason,subcity:subcityForWoreda(Number(document.getElementById('woreda').value))};if(!Number.isFinite(data.lat)||!Number.isFinite(data.lng)||data.lat<-90||data.lat>90||data.lng<-180||data.lng>180){toast('Enter valid latitude/longitude');return}if(x){Object.assign(x,data)}else{state.records.push({id:uid(),...data,createdBy:state.session.name,createdAt:new Date().toISOString(),status:state.session.role==='woreda'?'pending_subcity':state.session.role==='subcity'?'pending_city':'pending_city'})}save();closeModal();renderAll();toast(id?'Record updated':'Record created and sent for approval')}
function delRecord(id){let x=state.records.find(r=>r.id===id);if(!x||!canEdit(x)){toast('Delete is not available after approval');return}if(confirm('Delete this land record? This cannot be undone in the browser demo.')){state.records=state.records.filter(r=>r.id!==id);save();renderAll();toast('Record deleted')}}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="section-title"><div><h2>System Settings</h2><div class="notice">Configure Google Maps JavaScript API key and optional Woreda display names.</div></div></div><div class="grid two"><div class="card"><h3>Google Maps</h3><p class="notice">For the interactive map with colored activity markers, create/enable a Google Maps JavaScript API key and paste it below. Restrict the key by website/domain in Google Cloud before production use.</p><div class="field"><label>Google Maps JavaScript API Key</label><input id="googleKey" value="${esc(state.settings.googleKey)}" placeholder="AIza..."></div><button class="btn primary" style="margin-top:12px" onclick="saveMapKey()">Save Map Key</button><div class="alert info">Without a key, the Map page still opens a Google Maps embed centered on Addis Ababa / the first activity.</div></div><div class="card"><h3>Woreda Directory</h3><p class="notice">The prototype includes Woreda 01–119. Replace labels with the official AACEA directory names as they become available.</p><div class="field"><label>Woreda number</label><select id="wNum">${Array.from({length:119},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Display name</label><input id="wName" placeholder="e.g. Woreda 01"></div><button class="btn secondary" style="margin-top:10px" onclick="saveWoredaName()">Save Woreda Name</button></div></div><div class="card" style="margin-top:16px"><h3>Production architecture note</h3><p class="notice">This single-file build is a front-end prototype. A production AACEA system should move authentication, records, role permissions, approval signatures, audit logs and document storage to a server/database. Use HTTPS, server-side authorization, immutable audit logs, backups and an approved digital-signature/PKI solution.</p></div>`}
function saveMapKey(){state.settings.googleKey=document.getElementById('googleKey').value.trim();save();renderAll();toast('Google Maps key saved')}
function saveWoredaName(){let n=document.getElementById('wNum').value,name=document.getElementById('wName').value.trim();if(!name)return;state.settings.woredaNames[n]=name;save();renderAll();toast('Woreda name saved')}
init();
</script>
</body></html>
